[workspace]
resolver = "2"
members = [
    "crates/kladde",
    "crates/kladde-derive",
    "crates/kladde-types",
    "crates/kladde-varint",
    "crates/kladde-schema",
    "crates/kladde-store",
    "crates/kladde-persist",
    "crates/kladde-bench",
    "crates/kladde-svg",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0 OR BSL-1.0"
publish = false

[workspace.dependencies]
kladde = { path = "crates/kladde" }
kladde-derive = { path = "crates/kladde-derive" }
kladde-types = { path = "crates/kladde-types" }
kladde-varint = { path = "crates/kladde-varint" }
kladde-schema = { path = "crates/kladde-schema" }
kladde-store = { path = "crates/kladde-store" }
kladde-persist = { path = "crates/kladde-persist" }
kladde-bench = { path = "crates/kladde-bench" }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
thiserror = "2"
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
