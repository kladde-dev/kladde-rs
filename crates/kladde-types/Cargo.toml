[package]
name = "kladde-types"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
kladde-traits = { workspace = true }
kladde-alloc = { workspace = true }
kladde-derive = { workspace = true }
kladde = { workspace = true }
serde = { workspace = true, optional = true }
postcard = { workspace = true, optional = true }

[features]
# Gates `PersistableBlob<T>` -- the generic wrapper for foreign types that
# can't otherwise satisfy `Persistable` without leaking (see `blob.rs`'s
# module doc comment). Nothing else in this crate needs `serde`/`postcard`.
serde = ["dep:serde", "dep:postcard"]
