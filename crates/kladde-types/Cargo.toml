[package]
name = "kladde-types"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
kladde-persist = { workspace = true }
serde = { workspace = true, optional = true }
postcard = { workspace = true, optional = true }

[dev-dependencies]
kladde = { workspace = true }
kladde-store = { workspace = true }

[features]
# Gates `PersistableBlob<T>`, the wrapper for foreign types that can get
# neither a derive nor a hand-written `Persistable`. Nothing else in this crate
# needs `serde`/`postcard`.
serde = ["dep:serde", "dep:postcard"]
