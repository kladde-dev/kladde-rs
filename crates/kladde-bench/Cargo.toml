[package]
name = "kladde-bench"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# Realistic workloads on real files, measured flush by flush: the numbers
# behind kladde-docs' `content/evaluation/`. `text-bench` types into one
# long text, as a text editor would; kladde-svg's `svg-bench` records its
# tables with this crate's `row` and `save`. Run in release mode:
#
#     cargo run --release -p kladde-bench --bin text-bench -- <output directory>

[dependencies]
kladde-store = { workspace = true }
