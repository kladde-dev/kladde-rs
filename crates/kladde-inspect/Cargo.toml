[package]
name = "kladde-inspect"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# `kladde-inspect`, a command-line report on any kladde file: where its
# bytes go, page by page, what a fully consolidated copy would take, and,
# decoded by the file's own schema, which values take the space. It reads the
# file into memory and writes nothing back:
#
#     cargo run --release -p kladde-inspect -- <file.kladde>

[dependencies]
kladde-store = { workspace = true }
kladde-schema = { workspace = true }
kladde-varint = { workspace = true }
