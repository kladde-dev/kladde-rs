[package]
name = "kladde-persist"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# Kladde's serialization layer on top of `kladde-store`: `Location`, the
# `Persistable` trait and its guards, the scalar and tuple implementations, and
# the schema binding. Everything here is kladde-specific; the store knows none
# of it.

[dependencies]
kladde-store = { workspace = true }
kladde-schema = { workspace = true }
kladde-varint = { workspace = true }
