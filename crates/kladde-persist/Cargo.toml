[package]
name = "kladde-persist"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# Kladde's serialization layer on top of the standalone `kladde-heap`: the
# on-file pointer byte encoding (`PointerRepr`), `Location`, the `Persistable`
# trait, the typed `WriteBackendExt` conveniences, and the container(s) built on
# them. Everything here is kladde-specific; the reusable heap knows none of it.

[dependencies]
kladde-heap = { workspace = true }
