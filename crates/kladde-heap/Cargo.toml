[package]
name = "kladde-heap"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# A standalone, type-agnostic relocatable persistent heap: pointers, an
# `Allocator` over stable ids, a `Storage` byte interface, and the
# `Backend`/`ReadBackend`/`WriteBackend` split that composes them. Deliberately
# free of any `Persistable`/serde/kladde dependency so it can be reused on its
# own (see `assessment.md`, "kladde-alloc as a standalone product"). The kladde
# serialization layer lives on top, in `kladde-persist`.

