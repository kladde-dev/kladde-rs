[package]
name = "example"
version = "0.1.0"
edition.workspace = true
publish = false

[dependencies]
kladde = { workspace = true }
kladde-types = { workspace = true }
kladde-derive = { workspace = true }
# Required alongside kladde-derive whenever #[derive(Persistable)] is used
# directly (as opposed to only using kladde-types' own container types) --
# the generated code references `::kladde_traits::...`/`::serde::...`
# paths, which need to resolve as direct dependencies of the crate the
# macro expands in. The same reason `#[derive(serde::Serialize)]` requires
# a direct `serde` dependency, not just `serde_derive`.
kladde-traits = { workspace = true }
serde = { workspace = true }
# Needed directly too: `#[derive(Persistable)]` on an enum generates code
# that calls `::postcard::to_allocvec`/`from_bytes` (an enum is treated
# as an "owning" type storing its postcard-serialized whole value -- see
# kladde-derive's crate doc comment), same direct-dependency requirement
# as kladde-traits/serde above.
postcard = { workspace = true }
